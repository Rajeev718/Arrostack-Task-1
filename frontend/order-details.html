
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>
    <link rel="stylesheet" href="css/order-details.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <div>
                <h1>Order Details</h1>
                <p>Complete information about this order</p>
            </div>

            <button id="backButton">Back to Orders</button>
        </header>

        <div id="pageMessage"></div>

        <section class="order-info">
            <h2>Order Information</h2>

            <p>Order ID: <strong id="orderId">—</strong></p>
            <p>Customer: <strong id="customerName">—</strong></p>
            <p>Order Date: <strong id="orderDate">—</strong></p>
            <p>Status: <strong id="orderStatus">—</strong></p>
        </section>

        <section class="items-section">
            <h2>Ordered Products</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Unit Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody id="itemsBody">
                        <tr>
                            <td colspan="4">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <h3 class="grand-total">
                Grand Total: <span id="grandTotal">₹0.00</span>
            </h3>
        </section>

    </div>

    <script src="js/order-details.js"></script>

</body>
</html>
